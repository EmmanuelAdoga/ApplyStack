<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ApplyStack | Reset Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:#1a2744; --indigo:#4f6ef7; --indigo2:#3a5ce4;
      --green:#166534; --green-bg:#dcfce7; --green-bd:#86efac;
      --red:#991b1b; --red-bg:#fef2f2;
      --gray50:#f8fafc; --gray100:#f1f5f9; --gray200:#e2e8f0;
      --gray400:#94a3b8; --gray600:#475569; --gray800:#1e293b;
    }
    body { font-family:'Inter',system-ui,sans-serif; background:var(--gray50); color:var(--gray800); min-height:100vh; display:flex; flex-direction:column; }
    nav { background:#fff; border-bottom:1px solid var(--gray200); padding:16px 24px; display:flex; align-items:center; justify-content:space-between; }
    .logo { font-size:1.3rem; font-weight:900; color:var(--navy); text-decoration:none; }
    .logo span { color:var(--indigo); }
    .nav-back { font-size:.9rem; color:var(--gray600); text-decoration:none; }
    .nav-back:hover { color:var(--navy); }
    main { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
    .auth-card {
      background:#fff; border:1px solid var(--gray200); border-radius:18px;
      padding:40px 36px; width:100%; max-width:420px;
      box-shadow:0 4px 24px rgba(0,0,0,.07);
    }
    .auth-title { font-size:1.5rem; font-weight:900; color:var(--navy); margin-bottom:6px; }
    .auth-sub { font-size:.95rem; color:var(--gray600); margin-bottom:28px; line-height:1.6; }
    .f { margin-bottom:16px; }
    .f label { display:block; font-size:.8rem; font-weight:700; color:var(--gray600); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; }
    .f input { width:100%; padding:12px 14px; border:1.5px solid var(--gray200); border-radius:10px; font-size:.95rem; font-family:inherit; color:var(--gray800); background:#fafbfd; outline:none; transition:border-color .15s,box-shadow .15s; }
    .f input:focus { border-color:var(--indigo); box-shadow:0 0 0 3px rgba(79,110,247,.1); background:#fff; }
    .btn-primary { width:100%; padding:14px; background:linear-gradient(135deg,var(--indigo),var(--indigo2)); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:700; font-family:inherit; cursor:pointer; transition:opacity .15s; margin-top:4px; }
    .btn-primary:hover:not(:disabled) { opacity:.9; }
    .btn-primary:disabled { opacity:.55; cursor:not-allowed; }
    .alert { display:none; padding:12px 14px; border-radius:8px; font-size:.9rem; margin-bottom:16px; }
    .alert.on { display:block; }
    .alert.error { background:var(--red-bg); color:var(--red); border:1px solid #fca5a5; }
    .alert.success { background:var(--green-bg); color:var(--green); border:1px solid var(--green-bd); }
    .spin { display:inline-block; width:16px; height:16px; border:2.5px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-right:8px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .pw-wrap { position:relative; }
    .pw-wrap input { padding-right:42px; }
    .pw-eye { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:1.1rem; color:var(--gray400); padding:2px; line-height:1; }
    .pw-eye:hover { color:var(--gray600); }
    .back-link { display:block; text-align:center; margin-top:18px; font-size:.88rem; color:var(--indigo); text-decoration:none; }
    .back-link:hover { text-decoration:underline; }
    @media (max-width:480px) {
      nav { padding:12px 16px; }
      main { padding:20px 0 0; align-items:flex-start; }
      body { background:#fff; }
      .auth-card { border:none; border-radius:0; box-shadow:none; padding:28px 20px 40px; max-width:100%; }
    }
  </style>
</head>
<body>
<nav>
  <a href="/" class="logo">Apply<span>Stack</span></a>
  <a href="/auth.html" class="nav-back">← Back to sign in</a>
</nav>
<main>
  <div class="auth-card">

    <!-- Step 1: Request reset email -->
    <div id="stepRequest">
      <div class="auth-title">Forgot your password?</div>
      <p class="auth-sub">Enter your email and we'll send you a reset link. It expires in 1 hour.</p>
      <div id="alertRequest" class="alert"></div>
      <form onsubmit="doForgot(event)">
        <div class="f">
          <label>Email address</label>
          <input type="email" id="forgotEmail" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <button class="btn-primary" type="submit" id="forgotBtn">Send reset link</button>
      </form>
      <a href="/auth.html" class="back-link">← Back to sign in</a>
    </div>

    <!-- Step 2: Set new password (shown when ?token= is in the URL) -->
    <div id="stepReset" style="display:none">
      <div class="auth-title">Set a new password</div>
      <p class="auth-sub">Choose a strong password — at least 8 characters.</p>
      <div id="alertReset" class="alert"></div>
      <form onsubmit="doReset(event)">
        <div class="f">
          <label>New password</label>
          <div class="pw-wrap">
            <input type="password" id="newPassword" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password" />
            <button type="button" class="pw-eye" onclick="togglePw('newPassword', this)" tabindex="-1">👁</button>
          </div>
        </div>
        <div class="f">
          <label>Confirm new password</label>
          <div class="pw-wrap">
            <input type="password" id="confirmPassword" placeholder="Repeat your password" required autocomplete="new-password" />
            <button type="button" class="pw-eye" onclick="togglePw('confirmPassword', this)" tabindex="-1">👁</button>
          </div>
        </div>
        <button class="btn-primary" type="submit" id="resetBtn">Update password</button>
      </form>
    </div>

  </div>
</main>

<script>
  // Determine which step to show based on URL token
  var _token = new URLSearchParams(location.search).get('token');
  if (_token) {
    document.getElementById('stepRequest').style.display = 'none';
    document.getElementById('stepReset').style.display   = 'block';
  }

  function showAlert(id, type, msg) {
    var el = document.getElementById(id);
    el.className = 'alert on ' + type;
    el.textContent = msg;
  }

  function setLoading(btnId, loading, defaultText) {
    var btn = document.getElementById(btnId);
    if (loading) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Please wait…'; }
    else          { btn.disabled = false; btn.textContent = defaultText; }
  }

  async function doForgot(e) {
    e.preventDefault();
    setLoading('forgotBtn', true, 'Send reset link');
    try {
      await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('forgotEmail').value.trim() }),
      });
      // Always show success — never reveal whether the email exists
      showAlert('alertRequest', 'success', 'If that email is registered, a reset link is on its way. Check your inbox (and spam folder).');
      document.getElementById('forgotBtn').style.display = 'none';
    } catch(err) {
      showAlert('alertRequest', 'error', 'Network error. Please try again.');
    } finally {
      setLoading('forgotBtn', false, 'Send reset link');
    }
  }

  async function doReset(e) {
    e.preventDefault();
    var pass = document.getElementById('newPassword').value;
    var conf = document.getElementById('confirmPassword').value;
    if (pass !== conf) { showAlert('alertReset', 'error', 'Passwords do not match.'); return; }
    setLoading('resetBtn', true, 'Update password');
    try {
      var res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: _token, password: pass }),
      });
      var data = await res.json();
      if (!res.ok) { showAlert('alertReset', 'error', data.error || 'Reset failed. Please try again.'); return; }
      showAlert('alertReset', 'success', 'Password updated! Redirecting you to sign in…');
      setTimeout(function() { window.location.href = '/auth.html'; }, 2000);
    } catch(err) {
      showAlert('alertReset', 'error', 'Network error. Please try again.');
    } finally {
      setLoading('resetBtn', false, 'Update password');
    }
  }

  function togglePw(inputId, btn) {
    var input = document.getElementById(inputId);
    var show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.textContent = show ? '🙈' : '👁';
  }
</script>
</body>
</html>
